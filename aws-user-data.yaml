#cloud-config
# ---------------------------------------------------------------------------
# Reproduces this machine's zsh setup (zplug + Powerlevel10k + plugins) on a
# fresh server via cloud-init.
#
# BEFORE USE:
#   - Replace every occurrence of the username "admin" below with the login
#     user that already exists on the target server/image, e.g.:
#       sed -i 's/\badmin\b/youruser/g' user-data.yaml
#   - This assumes that user can run passwordless sudo (needed for fzy's
#     "make install" step, and for chsh). Cloud images' default user
#     (debian/ubuntu/admin) normally has this already.
#   - Target server needs internet access at boot (apt + git clone github).
#   - .zshrc and .p10k.zsh are NOT embedded here (EC2 user-data is capped at
#     16 KB raw). setup-zsh.sh downloads them at boot from this same repo:
#       https://raw.githubusercontent.com/TaiJuWu/was-operator/main/zshrc
#       https://raw.githubusercontent.com/TaiJuWu/was-operator/main/p10k.zsh
#     Keep those files in sync with your local ~/.zshrc / ~/.p10k.zsh and
#     push before relaunching an instance with this user-data.
# ---------------------------------------------------------------------------

package_update: true
packages:
  - zsh
  - git
  - curl
  - build-essential
  - tmux

write_files:
  - path: /root/setup-zsh.sh
    permissions: '0755'
    content: |
      #!/bin/bash
      set -euo pipefail
      TARGET_USER="admin"
      TARGET_HOME=$(getent passwd "${TARGET_USER}" | cut -d: -f6)
      DOTFILES_BASE_URL="https://raw.githubusercontent.com/TaiJuWu/was-operator/main"

      curl -fsSL "${DOTFILES_BASE_URL}/zshrc" -o "${TARGET_HOME}/.zshrc"
      curl -fsSL "${DOTFILES_BASE_URL}/p10k.zsh" -o "${TARGET_HOME}/.p10k.zsh"
      chmod 0644 "${TARGET_HOME}/.zshrc"
      chmod 0664 "${TARGET_HOME}/.p10k.zsh"

      chsh -s /usr/bin/zsh "${TARGET_USER}"

      if [ ! -d "${TARGET_HOME}/.zplug" ]; then
        sudo -u "${TARGET_USER}" -H git clone --depth 1 https://github.com/zplug/zplug "${TARGET_HOME}/.zplug"
      fi

      sudo -u "${TARGET_USER}" -H env HOME="${TARGET_HOME}" zsh -c '
        source "$HOME/.zplug/init.zsh"
        zplug "romkatv/powerlevel10k", as:theme, depth:1
        zplug "zsh-users/zsh-history-substring-search"
        zplug "plugins/git", from:oh-my-zsh
        zplug "b4b4r07/enhancd", at:v1
        zplug "zsh-users/zsh-syntax-highlighting", defer:2
        zplug "zsh-users/zsh-autosuggestions"
        zplug "jhawthorn/fzy", as:command, rename-to:fzy, hook-build:"make && sudo make install"
        zplug install --force
      '

      chown -R "${TARGET_USER}:${TARGET_USER}" "${TARGET_HOME}/.zplug" "${TARGET_HOME}/.zshrc" "${TARGET_HOME}/.p10k.zsh"

      # Install Claude Code CLI (native installer, no Node.js required)
      sudo -u "${TARGET_USER}" -H env HOME="${TARGET_HOME}" bash -c 'curl -fsSL https://claude.ai/install.sh | bash'

runcmd:
  - [ bash, /root/setup-zsh.sh ]
